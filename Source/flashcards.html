<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards de Estudo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #d4d4d4;
    --surface: #1a1815;
    --card-front: #d4d4d4;
    --card-back: #2a1f0e;
    --accent: #e8a94b;
    --accent-dim: #a87630;
    --text-primary: #f0e8d8;
    --text-muted: #7a7060;
    --border: #a0a0a0;
    --gold-glow: rgba(232, 169, 75, 0.15);
    --radius: 16px;
    --bg-card: #e6e6e6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  header {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 56px 24px 32px;
    border-bottom: 1px solid var(--border);
  }

  .header-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
    opacity: 0.8;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 400;
    color: var(--text-primary);
    letter-spacing: -0.01em;
    line-height: 1.1;
  }

  header h1 span {
    color: var(--accent);
    font-style: italic;
  }

  .header-sub {
    margin-top: 14px;
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 300;
    letter-spacing: 0.02em;
  }

  /* Stats bar */
  .stats {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    gap: 40px;
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
  }

  .stat-item {
    text-align: center;
  }

  .stat-number {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    color: var(--accent);
    line-height: 1;
  }

  .stat-label {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* Controls */
  .controls {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding: 24px;
    flex-wrap: wrap;
  }

  .btn {
    padding: 9px 22px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn:hover {
    border-color: var(--accent-dim);
    color: var(--accent);
    background: rgba(232, 169, 75, 0.06);
  }

  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #0f0e0c;
    font-weight: 600;
  }

  .btn.primary:hover {
    background: #f0bc65;
    border-color: #f0bc65;
    color: #0f0e0c;
  }

  /* Grid */
  .grid-container {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 8px 24px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
  }

  /* Card */
  .card-wrapper {
    perspective: 1000px;
  }

  .card {
    width: 100%;
    aspect-ratio: 3/4;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }

  .card.flipped {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
  }

  /* Front face */
  .card-front {
    background: var(--card-front);
    display: flex;
    flex-direction: column;
  }

  .card-front .image-area {
    flex: 1;
    overflow: hidden;
    position: relative;
    background: var(--bg-card);
  }

  .card-front .image-area img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
    filter: brightness(0.92) contrast(1.05);
  }

  .card-wrapper:hover .card:not(.flipped) .image-area img {
    transform: scale(1.04);
  }

  /* Hint stripe at bottom of front */
  .card-front .hint {
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card-front);
    border-top: 1px solid var(--border);
  }

  .hint-text {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .hint-icon {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 9px;
    transition: all 0.2s;
  }

  .card-wrapper:hover .hint-icon {
    border-color: var(--accent-dim);
    color: var(--accent);
    background: var(--gold-glow);
  }

  /* Back face */
  .card-back {
    background: var(--card-back);
    transform: rotateY(180deg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 20px;
    text-align: center;
    position: relative;
    gap: 16px;
  }

  .card-back::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: var(--radius);
    background: radial-gradient(ellipse at center, rgba(232, 169, 75, 0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .card-back .back-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid rgba(232, 169, 75, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(232, 169, 75, 0.08);
  }

  .card-back .back-icon svg {
    width: 22px;
    height: 22px;
    stroke: var(--accent);
    fill: none;
    stroke-width: 1.5;
  }

  .card-back .card-name {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.1rem, 2.5vw, 1.4rem);
    font-weight: 400;
    color: var(--text-primary);
    line-height: 1.3;
  }

  .card-back .card-desc {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.6;
    font-weight: 300;
  }

  .card-back .tag {
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid rgba(232, 169, 75, 0.25);
    padding: 4px 10px;
    border-radius: 100px;
    background: rgba(232, 169, 75, 0.05);
  }

  /* Placeholder / empty image area for demo */
  .placeholder-img {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: linear-gradient(135deg, #13110e 0%, #1c1912 100%);
  }

  .placeholder-img .ph-icon {
    font-size: 2.5rem;
    opacity: 0.5;
  }

  .placeholder-img .ph-text {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
  }

  /* Progress indicator */
  .progress-bar-wrap {
    position: relative;
    z-index: 1;
    max-width: 400px;
    margin: 0 auto;
    padding: 0 24px 8px;
  }

  .progress-track {
    height: 2px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 99px;
    transition: width 0.5s ease;
    width: 0%;
  }

  /* Tooltip */
  .tooltip {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--accent);
    color: #0f0e0c;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 8px 18px;
    border-radius: 100px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    white-space: nowrap;
    z-index: 100;
  }

  .tooltip.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Upload area */
  .add-card-area {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px 32px;
  }

  .add-card-btn {
    width: 100%;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 24px;
    background: transparent;
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    letter-spacing: 0.05em;
  }

  .add-card-btn:hover {
    border-color: var(--accent-dim);
    color: var(--accent);
    background: var(--gold-glow);
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    padding: 24px;
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px;
    width: 100%;
    max-width: 440px;
    transform: translateY(20px);
    transition: transform 0.3s ease;
  }

  .modal-overlay.open .modal {
    transform: translateY(0);
  }

  .modal h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 400;
    margin-bottom: 8px;
  }

  .modal p {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 28px;
    line-height: 1.6;
  }

  .field {
    margin-bottom: 18px;
  }

  .field label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .field input, .field textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text-primary);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }

  .field input:focus, .field textarea:focus {
    border-color: var(--accent-dim);
  }

  .field textarea { resize: vertical; min-height: 70px; }

  .upload-box {
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 28px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--bg);
  }

  .upload-box:hover {
    border-color: var(--accent-dim);
    background: var(--gold-glow);
  }

  .upload-box input { display: none; }
  .upload-box .upload-icon { font-size: 1.8rem; margin-bottom: 8px; }
  .upload-box p { font-size: 12px; color: var(--text-muted); }
  .upload-box .preview-img {
    max-height: 120px;
    border-radius: 8px;
    object-fit: cover;
    margin-top: 8px;
  }

  .modal-actions { display: flex; gap: 10px; margin-top: 28px; }
  .modal-actions .btn { flex: 1; text-align: center; }

  /* Responsive */
  @media (max-width: 520px) {
    .grid-container {
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 8px 16px 60px;
    }
    .stats { gap: 24px; }
  }

  /* Animation on load */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-wrapper {
    opacity: 0;
    animation: fadeUp 0.5s ease forwards;
  }
</style>
</head>
<body>

<header>
  <div class="header-label">Modo de Estudo</div>
  <h1>Flash<span>Cards</span></h1>
  <p class="header-sub">Clique em cada card para revelar o nome</p>
</header>

<div class="stats">
  <div class="stat-item">
    <div class="stat-number" id="totalCount">0</div>
    <div class="stat-label">Total</div>
  </div>
  <div class="stat-item">
    <div class="stat-number" id="revealedCount">0</div>
    <div class="stat-label">Revelados</div>
  </div>
  <div class="stat-item">
    <div class="stat-number" id="remainCount">0</div>
    <div class="stat-label">Restantes</div>
  </div>
</div>

<div class="controls">
  <button class="btn" onclick="resetAll()">↺ Reiniciar</button>
  <button class="btn" onclick="shuffleCards()">⇄ Embaralhar</button>
  <button class="btn primary" onclick="openModal()">+ Novo Card</button>
</div>

<div class="progress-bar-wrap">
  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>
</div>

<div class="grid-container" id="cardGrid"></div>

<div class="add-card-area">
  <button class="add-card-btn" onclick="openModal()">
    <span>＋</span> Adicionar novo flashcard
  </button>
</div>

<div class="tooltip" id="tooltip"></div>

<!-- Modal para adicionar card -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <h2>Novo Card</h2>
    <p>Adicione uma imagem e o nome que será revelado ao clicar.</p>

    <div class="field">
      <label>Imagem</label>
      <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <input type="file" id="fileInput" accept="image/*" onchange="previewImage(event)">
        <div id="uploadContent">
          <div class="upload-icon">🖼️</div>
          <p>Clique para selecionar uma imagem</p>
        </div>
      </div>
    </div>

    <div class="field">
      <label>Nome / Resposta</label>
      <input type="text" id="cardName" placeholder="Ex: Mitocôndria, Napoleão, Teorema de Pitágoras...">
    </div>

    <div class="field">
      <label>Descrição (opcional)</label>
      <textarea id="cardDesc" placeholder="Uma breve descrição ou contexto..."></textarea>
    </div>

    <div class="field">
      <label>Categoria (opcional)</label>
      <input type="text" id="cardTag" placeholder="Ex: Biologia, História, Matemática...">
    </div>

    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn primary" onclick="addCard()">Criar Card</button>
    </div>
  </div>
</div>

<script>
  // ─── Sample data (placeholder images via picsum) ─────────────────────────────
  const sampleCards = [
    {
      name: "Momo Ayase",
      desc: "Momo",
      tag: "Dan Da Dan",
      imageUrl: "https://static.wikia.nocookie.net/dandadan/images/c/ce/Momo_Ayase_Anime_Infobox_2.png/revision/latest?cb=20241116233954"
    },
    {
      name: "Ken Takakura",
      desc: "Ken",
      tag: "Dan Da Dan",
      imageUrl: "https://static.wikia.nocookie.net/dandadan/images/e/e0/Okarun_Anime_Infobox_2.png/revision/latest?cb=20241218045003"
    },
    {
      name: "Aira Shiratori",
      desc: "Aira",
      tag: "Dan Da Dan",
      imageUrl: "https://static.wikia.nocookie.net/dandadan/images/3/35/Aira_Shiratori_Infobox.png/revision/latest?cb=20241216161245"
    },
    {
      name: "Turbo Granny",
      desc: "Turbo",
      tag: "Dan Da Dan",
      imageUrl: "https://static.wikia.nocookie.net/dandadan/images/8/84/Turbo_Granny_%28Doll%29_Infobox_%28Anime%29.png/revision/latest?cb=20241031174232"
    },
    {
      name: "Alucard",
      desc: "Alucard",
      tag: "Hellsing Ultimate",
      imageUrl: "https://i.redd.it/isj6ltwzsavf1.jpeg"
    },
    {
      name: "Integra Hellsing",
      desc: "Integra",
      tag: "Hellsing Ultimate",
      imageUrl: "https://static.wikia.nocookie.net/p__/images/5/58/Integra_Hellsing.png/revision/latest?cb=20240220141728&path-prefix=protagonist"
    },
    {
      name: "Seras Victoria",
      desc: "Seras",
      tag: "Hellsing Ultimate",
      imageUrl: "https://preview.redd.it/seras-victoria-hellsing-ultimate-vs-whole-mha-verse-who-wins-v0-lu7d4or9k56e1.jpg?width=600&format=pjpg&auto=webp&s=ce6e1b220c2743bc9ec4bf1cfbf0cc132b6a8df0"
    },
    {
      name: "Rip Van Winkle",
      desc: "Rip Van",
      tag: "Hellsing Ultimate",
      imageUrl: "https://static.wikia.nocookie.net/villainous-beauties/images/e/ec/Rip_van_Winkle.jpg/revision/latest?cb=20250522145946"
    },
    {
      name: "Padre Alexander Anderson",
      desc: "Padre Alexander",
      tag: "Hellsing Ultimate",
      imageUrl: "https://preview.redd.it/alexander-anderson-hellsing-ultimate-v0-yylas85gzxm91.jpg?width=640&crop=smart&auto=webp&s=781cdfe3f6b6d7279e425f0a391e73e830cecb99"
    },
    {
      name: "Denji",
      desc: "Denji",
      tag: "Chawsaw man",
      imageUrl: "https://metagalaxia.com.br/wp-content/uploads/2024/03/Chainsaw-Man-Denji.webp"
    },
    {
      name: "Pochita",
      desc: "Pochita",
      tag: "Chawsaw man",
      imageUrl: "https://static.wikia.nocookie.net/chainsaw-man/images/5/54/Pochita_anime_design.png/revision/latest/scale-to-width/360?cb=20220919121110"
    },
    {
      name: "Power",
      desc: "Power",
      tag: "Chawsaw man",
      imageUrl: "https://upload.wikimedia.org/wikipedia/en/thumb/c/c2/Power_%28Chainsaw_Man%29.png/250px-Power_%28Chainsaw_Man%29.png"
    },
    {
      name: "Makima",
      desc: "Makima",
      tag: "Chawsaw man",
      imageUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRN8JIaveVWmxRXFIBUqiPh_o6mGDe8l2_6fA&s"
    },
    {
      name: "Aki Hayakawa",
      desc: "Aki",
      tag: "Chawsaw man",
      imageUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS1_0jOTfe9DC2nygElDVAmm9qMHcKIzQcN3j2erAWJoLOlqAkNAp9nGC4&s=10"
    },
    {
      name: "Inosuke Hashibira",
      desc: "Inosuke",
      tag: "Demon Slayer",
      imageUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRzXhj75GYLWrj236K3svAyB9ZYM6-hpKtYj9jHudLeFP18DjU4XexoK-J7&s=10"
    },
  ];

  let cards = [...sampleCards];
  let flippedSet = new Set();

  // ─── Render ───────────────────────────────────────────────────────────────────
  function render() {
    const grid = document.getElementById('cardGrid');
    grid.innerHTML = '';
    cards.forEach((card, i) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'card-wrapper';
      wrapper.style.animationDelay = `${i * 60}ms`;

      const isFlipped = flippedSet.has(i);

      wrapper.innerHTML = `
        <div class="card ${isFlipped ? 'flipped' : ''}" data-index="${i}" onclick="flipCard(this)">
          <div class="card-face card-front">
            <div class="image-area">
              ${card.imageUrl
                ? `<img src="${card.imageUrl}" alt="${card.name}" loading="lazy">`
                : `<div class="placeholder-img">
                     <div class="ph-icon">🖼️</div>
                     <div class="ph-text">Sem imagem</div>
                   </div>`
              }
            </div>
            <div class="hint">
              <span class="hint-text">Clique para revelar</span>
              <span class="hint-icon">?</span>
            </div>
          </div>
          <div class="card-face card-back">
            <div class="back-icon">
              <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
            </div>
            <div class="card-name">${card.name}</div>
            ${card.desc ? `<div class="card-desc">${card.desc}</div>` : ''}
            ${card.tag ? `<div class="tag">${card.tag}</div>` : ''}
          </div>
        </div>`;
      grid.appendChild(wrapper);
    });
    updateStats();
  }

  function flipCard(cardEl) {
    const i = parseInt(cardEl.dataset.index);
    if (flippedSet.has(i)) {
      flippedSet.delete(i);
      cardEl.classList.remove('flipped');
    } else {
      flippedSet.add(i);
      cardEl.classList.add('flipped');
      showTooltip(cards[i].name);
    }
    updateStats();
  }

  // ─── Stats & progress ─────────────────────────────────────────────────────────
  function updateStats() {
    const total = cards.length;
    const revealed = flippedSet.size;
    document.getElementById('totalCount').textContent = total;
    document.getElementById('revealedCount').textContent = revealed;
    document.getElementById('remainCount').textContent = total - revealed;
    const pct = total ? (revealed / total) * 100 : 0;
    document.getElementById('progressFill').style.width = pct + '%';
  }

  // ─── Controls ─────────────────────────────────────────────────────────────────
  function resetAll() {
    flippedSet.clear();
    render();
  }

  function shuffleCards() {
    cards = cards.sort(() => Math.random() - 0.5);
    flippedSet.clear();
    render();
  }

  // ─── Tooltip ──────────────────────────────────────────────────────────────────
  let tooltipTimer;
  function showTooltip(text) {
    clearTimeout(tooltipTimer);
    const tip = document.getElementById('tooltip');
    tip.textContent = text;
    tip.classList.add('show');
    tooltipTimer = setTimeout(() => tip.classList.remove('show'), 2200);
  }

  // ─── Modal ───────────────────────────────────────────────────────────────────
  let pendingImageUrl = null;
  let pendingImageDataUrl = null;

  function openModal() {
    document.getElementById('modalOverlay').classList.add('open');
    document.getElementById('cardName').value = '';
    document.getElementById('cardDesc').value = '';
    document.getElementById('cardTag').value = '';
    document.getElementById('uploadContent').innerHTML = `
      <div class="upload-icon">🖼️</div>
      <p>Clique para selecionar uma imagem</p>`;
    pendingImageUrl = null;
    pendingImageDataUrl = null;
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  }

  function previewImage(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      pendingImageDataUrl = ev.target.result;
      document.getElementById('uploadContent').innerHTML = `
        <img class="preview-img" src="${pendingImageDataUrl}" alt="preview">
        <p style="margin-top:8px;font-size:11px;">${file.name}</p>`;
    };
    reader.readAsDataURL(file);
  }

  function addCard() {
    const name = document.getElementById('cardName').value.trim();
    if (!name) {
      document.getElementById('cardName').focus();
      document.getElementById('cardName').style.borderColor = '#c0392b';
      setTimeout(() => document.getElementById('cardName').style.borderColor = '', 1200);
      return;
    }
    cards.unshift({
      name,
      desc: document.getElementById('cardDesc').value.trim(),
      tag: document.getElementById('cardTag').value.trim(),
      imageUrl: pendingImageDataUrl || null
    });
    flippedSet = new Set([...flippedSet].map(i => i + 1)); // shift indices
    closeModal();
    render();
  }

  // ─── Init ─────────────────────────────────────────────────────────────────────
  render();
</script>
</body>
</html>
