<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards de Estudo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>

<header>
  <div class="header-label">Modo de Estudo</div>
  <h1>Flash<span>Cards</span></h1>
  <p class="header-sub">Clique em cada card para revelar o nome</p>
</header>

<div class="stats">
  <div class="stat-item">
    <div class="stat-number" id="totalCount">0</div>
    <div class="stat-label">Total</div>
  </div>
  <div class="stat-item">
    <div class="stat-number" id="revealedCount">0</div>
    <div class="stat-label">Revelados</div>
  </div>
  <div class="stat-item">
    <div class="stat-number" id="remainCount">0</div>
    <div class="stat-label">Restantes</div>
  </div>
</div>

<div class="controls">
  <button class="btn" onclick="resetAll()">↺ Reiniciar</button>
  <button class="btn" onclick="shuffleCards()">⇄ Embaralhar</button>
  <button class="btn primary" onclick="openModal()">+ Novo Card</button>
</div>

<div class="progress-bar-wrap">
  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>
</div>

<div class="grid-container" id="cardGrid"></div>

<div class="add-card-area">
  <button class="add-card-btn" onclick="openModal()">
    <span>＋</span> Adicionar novo flashcard
  </button>
</div>

<div class="tooltip" id="tooltip"></div>

<!-- Modal para adicionar card -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <h2>Novo Card</h2>
    <p>Adicione uma imagem e o nome que será revelado ao clicar.</p>

    <div class="field">
      <label>Imagem</label>
      <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <input type="file" id="fileInput" accept="image/*" onchange="previewImage(event)">
        <div id="uploadContent">
          <div class="upload-icon">🖼️</div>
          <p>Clique para selecionar uma imagem</p>
        </div>
      </div>
    </div>

    <div class="field">
      <label>Nome / Resposta</label>
      <input type="text" id="cardName" placeholder="Ex: Mitocôndria, Napoleão, Teorema de Pitágoras...">
    </div>

    <div class="field">
      <label>Descrição (opcional)</label>
      <textarea id="cardDesc" placeholder="Uma breve descrição ou contexto..."></textarea>
    </div>

    <div class="field">
      <label>Categoria (opcional)</label>
      <input type="text" id="cardTag" placeholder="Ex: Biologia, História, Matemática...">
    </div>

    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn primary" onclick="addCard()">Criar Card</button>
    </div>
  </div>
</div>

</body>
</html>
